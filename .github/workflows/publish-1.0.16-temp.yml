name: Publish Moment 1.0.16

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.16

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-edec-81fd-940b-cb84fde21d3d/raw?se=2026-09-12T05%3A40%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=b339d39e-fe21-5c87-9b9a-aa498af9b453&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T00%3A52%3A13Z&ske=2026-09-13T00%3A52%3A13Z&sks=b&skv=2026-02-06&sig=acW0MkjjLnIKZmG/GdUi2T8/G6jntnTn6FvHpysUpN8%3D'
      SOURCE_SHA: '5dbd3cad4ac2c29b6daa2192470d527dcfcb026a'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '035d8da35145f007ad9d6691c96342d744be75d17f6f9fc945bdc4b2be879743  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.16'
          echo '92c034031d5d1908ae647e93b375e5077ff993606d4299a0b5ca0537c3d6ddc0  main.js' | sha256sum --check -
          echo '920cf020051be68bcaf4565d41df0fb2f8214f8dc78d1fdf200409b4da7426df  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.16 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.16 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.16' \
            --notes "Moment 1.0.16 mobile editor keyboard and Memories timeline fix. Source: ${SOURCE_SHA}. Inline Edit now keeps the entire edit page visually stable while the iPhone/Android software keyboard opens or closes, without separately pinning the header; Memories restores timeline group spacing on mobile while keeping ItemView.contentEl as the sole vertical scroller."
