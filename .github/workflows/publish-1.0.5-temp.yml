name: Publish Moment 1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.release/publish-1.0.5'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-16c4-8230-b199-ef7ee624419c/raw?se=2026-09-11T07%3A38%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=0eba6dd4-6fba-5581-92d8-4b319e1a3fbf&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T05%3A58%3A45Z&ske=2026-09-12T05%3A58%3A45Z&sks=b&skv=2026-02-06&sig=MkSoBidxSD8Nbs0mxCuOaT1psZcsPocWXizOr3XrVRQ%3D'
      SOURCE_SHA: 'af2fce06dd99a2559ae920a3770f23b0a83bc265'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo 'c6ce0cc3cef7594739c537011935e37e1ef29efe88fc9349520645b72f2278cf  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.5'
          echo '84b0618c7ddfb9ad653356cde264fe79a1f9e3f0788f7e1a8bfd53e81b9c0411  main.js' | sha256sum --check -
          echo '1371f04e1270aff7fca1ab18791cffa0c4f04a2a95f0657fa3d7acc318110a34  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Publish 1.0.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.5 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.5' \
            --notes "Moment 1.0.5 calendar polish. Source: ${SOURCE_SHA}. Adds mobile bottom clearance for Calendar pages; removes per-record tags from month/year review cards; gives more space to text; centers review-card media; and keeps audio chips visible alongside text and images."
