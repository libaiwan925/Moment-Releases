name: Publish Moment 1.0.23

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.23

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-c3cc-8230-afe0-38f8cbb39a18/raw?se=2026-09-12T08%3A10%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=4e1b6415-6b0a-5ec6-a453-4c7ae8e76abe&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A14%3A03Z&ske=2026-09-13T01%3A14%3A03Z&sks=b&skv=2026-02-06&sig=gXyLlCuUa7ElTSZsDgbtql9fk7Wzw6il/TyBQdmwCuk%3D'
      SOURCE_SHA: 'f8d04f0d9767c70eca97b93a0ce2246718a94d35'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '3d57ac7da5b7f32ebe73c0dcbb2510e82a1e402a37831cfaded287c41a941db3  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.23'
          echo '80b1267a2231bd55e8294f5dccc8fa273bc7733a4622ad7e56a193f7699348a7  main.js' | sha256sum --check -
          echo '9163d4acd0ef97ae35287e1fdb602ef6a7211030fcdb0f23fbbd96a490515a67  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.23 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.23 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.23' \
            --notes "Moment 1.0.23 returns Inline Edit to the browser-native single-scroll-surface model: Timeline ItemView.contentEl is the only vertical scroller, while the edit shell/body stay in normal document flow. The 1.0.20-1.0.22 fixed-frame, nested edit scroller, overflow locking and viewport compensation paths are removed. Mobile keeps 16px inputs and safe-area spacing, and native focus reveal is allowed to scroll the page as needed. Source: ${SOURCE_SHA}."
