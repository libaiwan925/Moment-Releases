name: Publish Moment 1.0.2

on:
  push:
    branches: [main]
    paths:
      - '.release/publish-1.0.2'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-d32c-8230-854b-85a42d912187/raw?se=2026-09-11T06%3A14%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=efb892b1-8796-5fcc-935f-8a15d97e8b63&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T05%3A58%3A44Z&ske=2026-09-12T05%3A58%3A44Z&sks=b&skv=2026-02-06&sig=Y1WMg5AX3GmrZJuAI792t%2BW5XyR362/8fcr/gMYFFk4%3D'
      SOURCE_SHA: '32098fa95f65ff6e86601799707443e74fb10487'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo 'c51d0a51260e225f948164a06d8f791b9026357d10f9396983fd6bf563b37c86  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.2'
          echo '2329d53c9580c6c7c05d19f3e68eac3cd49da55043b53e9f0a09c3416fcdd53f  main.js' | sha256sum --check -
          echo '1dad887eec9f4766f50262fd3b315a8749e115368d8392857986ffe1203c6e26  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Publish 1.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.2 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.2' \
            --notes "Moment 1.0.2 mobile validation build. Source: ${SOURCE_SHA}. Rewrites mobile editor scrolling without visualViewport height management; redesigns mobile back-to-top, image remove target, Memories seven-day strip, and separates loading from true empty states."
