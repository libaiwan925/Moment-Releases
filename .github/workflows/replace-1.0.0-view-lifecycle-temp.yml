name: Replace Moment 1.0.0 view lifecycle build

on:
  push:
    branches: [main]
    paths:
      - '.release/replace-1.0.0-view-lifecycle'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-3450-820b-85f7-0b8a713e51af/raw?se=2026-09-10T16%3A45%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=bf5b4dc8-7bec-546a-9924-79fd96368770&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A14%3A35Z&ske=2026-09-11T03%3A14%3A35Z&sks=b&skv=2026-02-06&sig=OZgqmJu9KpqW9WxfhG0Sm/vZWwBaRigFBlTFN5ewga8%3D'
      SOURCE_SHA: '5d04a77bb392d54387e0780df748f80864dbef45'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '3cd79193249f3f1e4a3ce0ca08e9afdce8d7fb0aa7951fb9c50bec054b30039d  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.0'
          echo 'aa730d9dccbb6bb44e817d7d4d486f0db599e2413cf2ecd7aea3f5264d08544f  main.js' | sha256sum --check -
          echo '3bbe9291df2e7273348e3595e68e874c26672adca25a549e2c1a34cb6df53efb  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Replace 1.0.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release upload 1.0.0 main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit 1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Moment 1.0.0 Timeline view-lifecycle test build. Source build: ${SOURCE_SHA}. Reuses the existing Timeline leaf instead of flipping empty -> timeline when reopening Moment."
