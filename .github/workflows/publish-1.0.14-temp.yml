name: Publish Moment 1.0.14

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.14

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-d2b4-81fd-b77d-014c089c3ccf/raw?se=2026-09-12T03%3A31%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=d494ffcf-cdbe-5207-9b52-868b09a20efc&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A23%3A51Z&ske=2026-09-13T01%3A23%3A51Z&sks=b&skv=2026-02-06&sig=7V3AvoSkK2oXRNeTbw9SuNCHW22scemIVX0L5i9o9bM%3D'
      SOURCE_SHA: '57f4c4f810dc282a296ea47ec82f186cfc25cc98'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo 'c1ef5bcd2b91f40612fcddfe25f913438584f2438e961b8885e3d44a6c4d87ec  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.14'
          echo '827b7da62e35ef26a3e6da8ef95ce23acc225eda5131342f6264d6f37e5faff2  main.js' | sha256sum --check -
          echo '38343a1c4a7e8cf1f215cef1e408a33369bbff5be672d8d8aa8a537a398b65ca  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.14 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.14 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.14' \
            --notes "Moment 1.0.14 mobile page geometry update. Source: ${SOURCE_SHA}. Mobile pages use a tighter top inset; Memories now scrolls as one whole page; Edit no longer switches to the absolute full-height layout, removes scrollTop pinning, keeps mobile form text at 16px to avoid WebView focus zoom, and keeps the date/action row visible while editing."
