name: Publish BRAT release

on:
  push:
    branches: [main]
    paths:
      - ".release/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish 1.0.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DIR=".release/1.0.0"
          gh release upload "1.0.0" \
            "$DIR/main.js" \
            "$DIR/manifest.json" \
            "$DIR/styles.css" \
            --clobber
          gh release edit "1.0.0" \
            --title "1.0.0" \
            --prerelease=false \
            --latest \
            --notes "Moment 1.0.0 release for Obsidian / BRAT installation. Source build: 4e3c2286f1d5ea87c9de7771cb51a60fc75ac3a2"
