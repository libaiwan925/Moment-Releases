name: Publish BRAT release

on:
  push:
    branches: [main]
    paths:
      - ".release/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < .release/VERSION)"
          DIR=".release/$VERSION"
          test -f "$DIR/main.js"
          test -f "$DIR/manifest.json"
          test -f "$DIR/styles.css"
          node -e 'const fs=require("fs"); const version=fs.readFileSync(".release/VERSION","utf8").trim(); const m=JSON.parse(fs.readFileSync(".release/"+version+"/manifest.json","utf8")); if(m.version!==version) { throw new Error("manifest version "+m.version+" != "+version); } if(m.id!=="moment") { throw new Error("unexpected plugin id: "+m.id); } if(m.isDesktopOnly!==false) { throw new Error("mobile support is disabled in manifest"); }'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < .release/VERSION)"
          DIR=".release/$VERSION"
          SOURCE_SHA="$(cat .release/SOURCE_SHA 2>/dev/null || true)"
          NOTES="Moment $VERSION release for Obsidian / BRAT installation."
          if [ -n "$SOURCE_SHA" ]; then
            NOTES="$NOTES Source build: $SOURCE_SHA"
          fi

          LEGACY_VERSION="1.0.1-beta.1"
          if [ "$VERSION" = "1.0.0" ] && gh release view "$LEGACY_VERSION" >/dev/null 2>&1; then
            gh release delete "$LEGACY_VERSION" --yes --cleanup-tag
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION"               "$DIR/main.js"               "$DIR/manifest.json"               "$DIR/styles.css"               --clobber
            gh release edit "$VERSION" --title "$VERSION" --prerelease=false --latest
          else
            gh release create "$VERSION"               "$DIR/main.js"               "$DIR/manifest.json"               "$DIR/styles.css"               --title "$VERSION"               --latest               --notes "$NOTES"
          fi
