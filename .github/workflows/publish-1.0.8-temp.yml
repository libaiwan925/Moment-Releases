name: Publish Moment 1.0.8

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.8

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-f4b8-81fd-80f9-a6bb9a06f4f7/raw?se=2026-09-11T10%3A39%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=4ecef41a-ac39-57b9-b955-303c450c0b96&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T06%3A21%3A48Z&ske=2026-09-12T06%3A21%3A48Z&sks=b&skv=2026-02-06&sig=dn0rMFBK2s/ro4anLcGGBecoGOhLYUG7GsXiX0vMadI%3D'
      SOURCE_SHA: '9a79fc2ec107d911dbafeb9955aac1ab487763de'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '2b645b3c2f4d4a7eda4647d70e665f44e11b1dd4596f9d8f80df78a76b089bcf  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.8'
          echo '8662b0eebeaf606a0784e308ec4cfeeb78feeae67da86107e18bb38c9895ac07  main.js' | sha256sum --check -
          echo 'b48d6985869ae0add70a06ee1e6516de8dcb573c802d4d4c5559877de60140c4  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.8 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.8' \
            --notes "Moment 1.0.8 responsive polish. Source: ${SOURCE_SHA}. Phone Calendar Day shows at most two tags; Year keeps its timeline with narrow-screen compaction and hides audio summary when text+image+audio coexist; Timeline shortcuts stay on one row; Android recording preview avoids duration/remove overlap; image and add-image cells share one square size."
