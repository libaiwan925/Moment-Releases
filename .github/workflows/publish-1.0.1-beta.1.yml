name: Publish Moment 1.0.1-beta.1

on:
  push:
    branches: [main]
    paths:
      - '.release/publish-1.0.1-beta.1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-7720-81fd-b489-42eae19d0e7b/raw?se=2026-09-10T12%3A07%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=bd1894f7-0e05-5395-b415-fb51cbb16a48&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A23%3A50Z&ske=2026-09-11T03%3A23%3A50Z&sks=b&skv=2026-02-06&sig=ICDZ89TuhJ1de2h2zmEjKpF7KJ2PICgm5gPE7l7byxc%3D'
      SOURCE_SHA: '52281c81fa1ed36dcf7b2056e667bd13d77db142'
      VERSION: '1.0.1-beta.1'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '15212e51d3e4ae2713eaba2a5fe114f85d632a4fbc9487900e054e26277ce067  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify and stamp plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.0'
          echo 'dbfe2cc14ee78db123984cff23ba05fecffe3e32eca73f5597b3d6bfa6661de7  main.js' | sha256sum --check -
          echo '3bbe9291df2e7273348e3595e68e874c26672adca25a549e2c1a34cb6df53efb  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = process.env.VERSION;
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"

      - name: Publish BRAT beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create "$VERSION" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --prerelease \
            --notes "Moment BRAT test build. Source build: ${SOURCE_SHA}"
