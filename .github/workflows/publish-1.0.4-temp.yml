name: Publish Moment 1.0.4

on:
  push:
    branches: [main]
    paths:
      - '.release/publish-1.0.4'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-4850-81f5-b46c-5e3047c0ba42/raw?se=2026-09-11T07%3A08%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=e9fe4f6f-aebf-5571-9848-4a453a05acd0&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T05%3A58%3A44Z&ske=2026-09-12T05%3A58%3A44Z&sks=b&skv=2026-02-06&sig=5svoXESVlMqBPRekO4XxUZzy2tL9o1egPSVPR3XIwdU%3D'
      SOURCE_SHA: '864143e59555c954340baddf3d2430c31df4b475'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo 'afa2d77ce8e1313c5fdd2c79e9f47ce21bbb46618aaafc8fb0378b9e2a422d68  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.4'
          echo '7be4e3e0f0381213d582349671b113bc077d300e1e458f3b673b2acf4bea0c39  main.js' | sha256sum --check -
          echo '7d8cc2c4082119215be242f7570f5f25a924832c9225483765eef270ae2ecaaf  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Publish 1.0.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.4 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.4' \
            --notes "Moment 1.0.4 mobile polish. Source: ${SOURCE_SHA}. Removes the fill from the Timeline back-to-top pill while aligning its icon and label; aligns Detail/Edit actions to the weekday/time baseline with matching typography; and tightens the delete/edit spacing."
