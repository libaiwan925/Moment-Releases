name: Publish Moment 1.0.6

on:
  push:
    branches: [main]
    paths:
      - '.release/publish-1.0.6'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-9310-8230-b5bd-1c4880b55e27/raw?se=2026-09-11T07%3A53%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=b7392307-b5bc-5c93-9490-8ae418f729d6&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T05%3A37%3A51Z&ske=2026-09-12T05%3A37%3A51Z&sks=b&skv=2026-02-06&sig=Cyj3m/djMqlRs55NpScNTNCQTlQ5gbKMTvvnGQrg9Y4%3D'
      SOURCE_SHA: 'f7092262ba50973213b9b28784c7eaed3521cbe0'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo 'fcd2eb7e9847ac76120fe5b6f53a8411fecd9578021f25663431c097f59e9d5b  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.6'
          echo 'bfbca658efba3adb80356a55e8ab26eecede69d87c3b3026dc6c244cd3081848  main.js' | sha256sum --check -
          echo '5437a5641a806b60c41882b87614721285f74bed1bf33fd5f7581cc42b0975ef  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Publish 1.0.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.6 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.6' \
            --notes "Moment 1.0.6 mobile Calendar polish. Source: ${SOURCE_SHA}. Month review cards use a single-column phone layout; month/year review audio chips are compact, transparent, and secondary to the text."
