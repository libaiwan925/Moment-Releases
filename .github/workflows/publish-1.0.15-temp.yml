name: Publish Moment 1.0.15

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.15

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-78c0-81fd-b84a-495f39f70147/raw?se=2026-09-12T04%3A02%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=01ace70d-1253-55eb-a720-9947e22f465f&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A11%3A42Z&ske=2026-09-13T01%3A11%3A42Z&sks=b&skv=2026-02-06&sig=CD8C99QHNvsEZYObvH3udZHTsa8KsE0nyxX/LfLIsBY%3D'
      SOURCE_SHA: 'e725e635810fbefd0cd31b590f49fa009252a937'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '84062d2ac42d90b276438dc4fd5f02fc8b47fcc34634932bc0d022e27a98260f  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.15'
          echo '82bfef63b7db1f67909e7b0dd4f8682dcc294d16566eb0f52e84b9d448f557f1  main.js' | sha256sum --check -
          echo '92da43cd6f4403a1af8e84d0a8e5991cd31cde4b56a147b783e18ee52ecee50c  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.15 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.15 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.15' \
            --notes "Moment 1.0.15 mobile scrolling/focus stabilization. Source: ${SOURCE_SHA}. Timeline, Memories and Calendar now share ItemView.contentEl as the sole vertical scroller; Memories keeps the Today action slot stable and resets the correct scroller when dates change; Android Inline Edit uses preventScroll focus handling to reduce keyboard-driven viewport jumps."
