name: Publish Moment 1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.release/publish-1.0.1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-bcdc-81fd-a79f-6bfe9a616735/raw?se=2026-09-11T03%3A32%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=ec669052-7c00-57c9-8950-e64203c68b43&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T01%3A20%3A46Z&ske=2026-09-12T01%3A20%3A46Z&sks=b&skv=2026-02-06&sig=Af7T8Z63eUvmUHPjYM6dbdKbMssa8FzxQ40dGluz84E%3D'
      SOURCE_SHA: '58995893716ecf98435cf1d815931221e14af361'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '1ee257a501df5ba8f323f09114949462422a52c14e00be6e7d4aa933e7c317e7  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.1'
          echo '212585915a17b608da905a305fef2eaefebcaec7cd664d2604038876c96c88e6  main.js' | sha256sum --check -
          echo '377103f7beb3db37a0dab6973ce47f7516c9e6f05aca56c3eaa67806dca73f48  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Publish 1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.1 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.1' \
            --notes "Moment 1.0.1 mobile UI test build. Source: ${SOURCE_SHA}. Fixes iOS editor viewport regression, mobile calendar navigation sizing, Timeline bottom safe-area overlap, and mobile Composer Publish layout."
