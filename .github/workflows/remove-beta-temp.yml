name: Remove temporary BRAT beta

on:
  push:
    branches: [main]
    paths:
      - '.release/remove-beta'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete 1.0.1-beta.1 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
