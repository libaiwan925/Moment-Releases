name: Publish Moment stable 1.0.0

on:
  pull_request:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - RELEASE_NOTES.md
      - .github/workflows/publish-stable.yml
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - styles.css
      - RELEASE_NOTES.md
      - .github/workflows/publish-stable.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    name: Validate build and publish stable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Validate exact source build artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in main.js manifest.json styles.css; do
            test -s "$f"
          done
          # Git object IDs match the private Moments build-artifacts branch,
          # generated by the successful source CI for commit 4729e8c.
          test "$(git hash-object main.js)" = "97015e5564e4d7e2e60fbe52106420d6a82d3427"
          test "$(git hash-object manifest.json)" = "55165c77c1a77c9ee3eaf24477e992336c869add"
          test "$(git hash-object styles.css)" = "319cfd409d00643bb0905389afa3a5fcaa7ac656"
          node --check main.js
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          assert.equal(m.id, 'moment');
          assert.equal(m.name, 'Moment');
          assert.equal(m.version, '1.0.0');
          assert.equal(m.minAppVersion, '1.13.7');
          assert.equal(m.isDesktopOnly, false);
          assert.ok(fs.statSync('main.js').size > 100000);
          assert.ok(fs.statSync('styles.css').size > 10000);
          NODE

      - name: Publish stable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "1.0.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Stable release 1.0.0 already exists; refusing to replace published assets."
            exit 1
          fi
          gh release create "1.0.0" \
            main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Moment 1.0.0" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Verify all published assets match the tested build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "1.0.0" --repo "$GITHUB_REPOSITORY" --dir published
          for f in main.js manifest.json styles.css; do
            cmp -s "$f" "published/$f"
            echo "Verified released file: $f"
          done
          test "$(find published -type f | wc -l | tr -d ' ')" = "3"
          echo "Release 1.0.0 contains all three byte-identical BRAT installation assets."
