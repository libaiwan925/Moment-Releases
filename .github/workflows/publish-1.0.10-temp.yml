name: Publish Moment 1.0.10

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.10

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-d9e0-81fd-84af-967444380ed2/raw?se=2026-09-11T12%3A41%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=d6efdb29-a1b3-5150-b35c-78a2bf9df204&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T03%3A37%3A53Z&ske=2026-09-12T03%3A37%3A53Z&sks=b&skv=2026-02-06&sig=rMsk9kzjJf5lXzSYcMVB3AGgYRs4zUOJfU05GeQ/cQI%3D'
      SOURCE_SHA: 'd7ebd56d2d5cfa29a2e6a9f32ce2fd8c6af6ba15'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo 'f1adcd9005c9cb6a5005ede1a6af42d5ad7507773e2d4982902c4af2d22ce234  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.10'
          echo '6158d702afa81d9dc07890675673c0c338ad08dd8615176b68082377d4a473cd  main.js' | sha256sum --check -
          echo '88b51df15195275c70c7546eceb95a667a3f8b52b471a5aff9660a55725da46c  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.10 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.10' \
            --notes "Moment 1.0.10 navigation/audio polish. Source: ${SOURCE_SHA}. Detail Back now returns to the page that opened it; Memories and Calendar restore Return Home; audio preview keeps aligned controls with a thin progress track; mobile Detail removes the separator dot before weekday/time."
