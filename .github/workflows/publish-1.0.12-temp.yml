name: Publish Moment 1.0.12

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.12

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-8d1c-81fd-afad-1ae61e7acbd3/raw?se=2026-09-11T13%3A05%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=274d96f9-8cce-54ea-8bfa-c761daebd118&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T02%3A13%3A55Z&ske=2026-09-12T02%3A13%3A55Z&sks=b&skv=2026-02-06&sig=0kdiB/4Uq2TKVvU2ycnxMYm/8tra5amCECuL1w67wrA%3D'
      SOURCE_SHA: '651c8ba94ea6904d40597f04561881b274456c8a'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '420d2feb4c3f3acacc848b81e7b3e4277ee22e20fb45bdaa832d8c33894f12e1  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.12'
          echo 'bf3d90929daa98b23c9ce52c009135966af9c98997a02e8419a773c4f756ca1e  main.js' | sha256sum --check -
          echo 'a4ec78b2050708c2e1b34e227f0014990d93064c93977a4ec525cf02716703ad  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.12 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.12' \
            --notes "Moment 1.0.12 mobile layout polish. Source: ${SOURCE_SHA}. Memories moves Today beside the title and tightens the date-strip spacing; Android composer/calendar image previews regain clear spacing below the text field."
