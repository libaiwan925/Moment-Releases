name: Replace Moment 1.0.0 startup fix

on:
  push:
    branches: [main]
    paths:
      - '.release/replace-1.0.0-startup-fix'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-8ec4-8230-8d70-d52e25a5d932/raw?se=2026-09-10T12%3A36%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=1b555cde-825e-55bc-827c-a35182873203&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T05%3A39%3A58Z&ske=2026-09-11T05%3A39%3A58Z&sks=b&skv=2026-02-06&sig=CUZozu154%2Bt6lp5fvIaydkr35Te40mXPFDk3sphVzK4%3D'
      SOURCE_SHA: '221326080f63533811d399c844d82d92ee4eb28e'
      FIX_SHA: 'bf78d42f4876656d55d0abf9bc361a7da34d0f72'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '6076eede469d1eb285004f33adb5451a03a8cbf4d972fdbae59906d66b2b0d22  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin

      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.0'
          echo '8b796673faa2fc94e431f169a73955d5cca04dba6571ac24e6e5b8ef394b7c74  main.js' | sha256sum --check -
          echo '3bbe9291df2e7273348e3595e68e874c26672adca25a549e2c1a34cb6df53efb  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -

      - name: Replace 1.0.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release upload 1.0.0 main.js manifest.json styles.css --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit 1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Moment 1.0.0 startup-deferral test build. Source build: ${SOURCE_SHA}. Startup fix: ${FIX_SHA}."
