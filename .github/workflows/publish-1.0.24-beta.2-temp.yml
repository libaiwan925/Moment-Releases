name: Publish Moment 1.0.24-beta.2

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.24-beta.2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ff78-81fd-97b2-f59f428ce61d/raw?se=2026-09-12T17%3A08%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=771068a2-3562-5556-9f62-27c25f7bdec9&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T14%3A15%3A49Z&ske=2026-09-13T14%3A15%3A49Z&sks=b&skv=2026-02-06&sig=L46Wfd4VBC53yqsvu/ozR2eW9Ap5cFBqJxAp5TRE1rI%3D'
      SOURCE_SHA: 'a2499be6bf88ce0eeeb9c365b48438e2b66b67bd'
      VERSION: '1.0.24-beta.2'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '622c28d3858f34b82d57b89a6a1af90493942bcb1af20fd2189968aa7b4e6ab1  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Prepare beta manifest
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          node - <<'NODE'
          const fs = require('fs');
          const path = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"
          echo '46f698a5e50cffebda9dfc0d6f8e0a9bc22a6f90e27d0865d3e57a444d3a63af  main.js' | sha256sum --check -
          echo 'c02095e7780f6e43400d00f79994d85424b29f9011d0ec14e5839e70f38fffd0  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create "$VERSION" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --prerelease \
            --notes "Moment mobile beta with an in-app command to generate comprehensive test dataset 11 on the device. Source: ${SOURCE_SHA}."
