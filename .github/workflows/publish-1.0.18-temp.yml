name: Publish Moment 1.0.18

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.18

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-8d20-8230-8237-7680074fa685/raw?se=2026-09-12T06%3A30%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=fa2dda05-8193-5686-ad70-2ca25c50fb53&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T03%3A22%3A54Z&ske=2026-09-13T03%3A22%3A54Z&sks=b&skv=2026-02-06&sig=l2ypYeJyvBoe4PdDU1DhJm5X46ONgMcf41/XyQ4wTcQ%3D'
      SOURCE_SHA: '477cf8f8eaaca4bcc5eb3a740af056af977afcdd'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '685a10b119fb859a1f7efce743b0aefb85bcff4d8c700136bd36cf1d2fc601c2  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = '1.0.18'
          echo '3bde8866229480dab682899a1c6a3dd087d1f18a459ada6b35b64fcfa1305a91  main.js' | sha256sum --check -
          echo 'bfbc25244bd2dc96fbed5a54e3b305b5dc9e86ba743342bb74f3cc6d3236d120  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish 1.0.18 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create 1.0.18 main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title '1.0.18' \
            --notes "Moment 1.0.18 unifies Inline Edit scrolling across desktop, tablet and mobile. Source: ${SOURCE_SHA}. The complete edit page is now the single scroller; return navigation, date/actions, text, images, audio, location and tags all move together. The nested mobile edit-body scroller and keyboard viewport compensation paths are removed. The editor textarea starts at a compact 6-row / 128px height, while mobile keeps 16px input text and safe-area spacing."
