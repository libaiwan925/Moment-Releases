name: Publish Moment 1.0.24-beta.1

"on":
  push:
    branches:
      - main
    paths:
      - .release/publish-1.0.24-beta.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-bd7c-81fd-b6bc-4f8dfc3699f6/raw?se=2026-09-12T16%3A50%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=80c3e967-1018-5601-bb50-23d3020dfcd9&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A11%3A42Z&ske=2026-09-13T01%3A11%3A42Z&sks=b&skv=2026-02-06&sig=IQZieMZKtfVwor4blC56Jd94pPWWtwWdZbnbAcbGdSk%3D'
      SOURCE_SHA: '4e964f225cf50f6fac0124a211df006605bad061'
      VERSION: '1.0.24-beta.1'
    steps:
      - name: Download verified build artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/moment-plugin.zip
          echo '394a753cab879437d6b4c81a0fe9fb720c27817b7a71c7832d4b526b142918a9  /tmp/moment-plugin.zip' | sha256sum --check -
          mkdir /tmp/moment-plugin
          unzip -q /tmp/moment-plugin.zip -d /tmp/moment-plugin
      - name: Prepare beta manifest
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          node - <<'NODE'
          const fs = require('fs');
          const path = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Verify plugin files
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"
          echo '39bb39242bb06eb587fcab8689a2f239f2c1806bbcf2b7e2aabfddc16da897b2  main.js' | sha256sum --check -
          echo '259f988b9374482a2e610bc61ad6a532a00d4972cc1052927a25ee6f53fa8421  manifest.json' | sha256sum --check -
          echo 'b24a18f878f944a59ffd10b85be6aee42d8d5248ea2e5b09416affabe5d073d5  styles.css' | sha256sum --check -
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/moment-plugin
          gh release create "$VERSION" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --prerelease \
            --notes "Moment mobile test build for Android/iOS BRAT verification. Source: ${SOURCE_SHA}."
